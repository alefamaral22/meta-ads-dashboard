<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Time de Agentes — Meta Ads</title>
<style>
:root {
  --bg: #07080f;
  --surface: #0d0f1e;
  --surface2: #121528;
  --surface3: #181c30;
  --border: #1e2340;
  --border2: #252b47;
  --accent: #4f6ef7;
  --accent2: #7c5cfc;
  --green: #22d3a5;
  --red: #f75959;
  --yellow: #f7c244;
  --blue: #38bdf8;
  --text: #e4eaf7;
  --dim: #6b7799;
  --muted: #2a3050;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}

/* ── FUNDO ANIMADO ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 15% 50%, rgba(79,110,247,.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 20%, rgba(124,92,252,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(34,211,165,.05) 0%, transparent 45%);
  animation: bgPulse 12s ease-in-out infinite alternate;
  pointer-events: none; z-index: 0;
}
@keyframes bgPulse {
  0%   { opacity: .7; transform: scale(1); }
  100% { opacity: 1;  transform: scale(1.05); }
}

/* ── TOPBAR ── */
.topbar {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 58px;
  background: rgba(13,15,30,.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #4f6ef7, #7c5cfc);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  box-shadow: 0 0 16px rgba(79,110,247,.4);
}
.brand h1 { font-size: .95rem; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: .72rem; color: var(--dim); }

.nav { display: flex; gap: 2px; }
.nav-btn {
  padding: 7px 16px; border-radius: 8px; border: none;
  background: transparent; color: var(--dim);
  font-size: .8rem; font-weight: 600; cursor: pointer;
  transition: all .2s; text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.nav-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
.nav-btn.active {
  background: rgba(79,110,247,.15);
  color: #a0b4ff;
  border: 1px solid rgba(79,110,247,.3);
}

/* ── LAYOUT ── */
.layout {
  position: relative; z-index: 1;
  display: flex;
  height: calc(100vh - 58px);
}

/* ── SIDEBAR ── */
.sidebar {
  width: 240px; flex-shrink: 0;
  background: rgba(13,15,30,.7);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-title {
  font-size: .65rem; font-weight: 800;
  color: var(--dim); text-transform: uppercase; letter-spacing: .1em;
}
.sidebar-subtitle {
  font-size: .75rem; color: var(--text); font-weight: 600; margin-top: 2px;
}

.agents-list { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; }
.agents-list::-webkit-scrollbar { width: 3px; }
.agents-list::-webkit-scrollbar-track { background: transparent; }
.agents-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.agent-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px; border-radius: 12px; cursor: pointer;
  border: 1px solid transparent; transition: all .2s;
  position: relative;
}
.agent-item:hover { background: rgba(255,255,255,.04); border-color: var(--border); }
.agent-item.active {
  background: rgba(79,110,247,.1);
  border-color: rgba(79,110,247,.25);
}
.agent-item.active::before {
  content: '';
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 60%; border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
}

.agent-avatar { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; overflow: hidden; }
.agent-avatar svg { width: 100%; height: 100%; }

.agent-meta { flex: 1; min-width: 0; }
.agent-meta-name { font-size: .82rem; font-weight: 700; color: var(--text); }
.agent-meta-role { font-size: .68rem; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-meta-status { display: flex; align-items: center; gap: 5px; margin-top: 4px; }

.status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.status-dot.ready   { background: var(--green); box-shadow: 0 0 6px rgba(34,211,165,.7); }
.status-dot.working { background: var(--yellow); box-shadow: 0 0 6px rgba(247,194,68,.7); animation: pulse 1.4s infinite; }
.status-dot.idle    { background: var(--muted); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.status-text { font-size: .68rem; }
.status-text.ready   { color: var(--green); }
.status-text.working { color: var(--yellow); }
.status-text.idle    { color: var(--dim); }

.badge {
  background: var(--red); color: #fff;
  border-radius: 20px; font-size: .62rem; font-weight: 800;
  padding: 2px 7px; min-width: 20px; text-align: center;
  box-shadow: 0 0 8px rgba(247,89,89,.5);
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.next-analysis {
  font-size: .68rem; color: var(--dim);
  display: flex; align-items: center; gap: 6px;
}
.next-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2.5s infinite; }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── AGENT HEADER ── */
.agent-header {
  padding: 20px 28px 18px;
  background: rgba(13,15,30,.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 20px;
  position: relative; overflow: hidden;
}
.agent-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, var(--agent-color1, rgba(79,110,247,.06)) 0%, transparent 60%);
  pointer-events: none;
}

.agent-header-avatar {
  width: 62px; height: 62px; border-radius: 16px; overflow: hidden; flex-shrink: 0;
  box-shadow: 0 0 24px var(--agent-glow, rgba(79,110,247,.4));
  border: 1px solid rgba(255,255,255,.08);
}
.agent-header-avatar svg { width: 100%; height: 100%; }

.agent-header-info { flex: 1; }
.agent-header-name {
  font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--text), var(--agent-accent, #a0b4ff));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.agent-header-role { font-size: .78rem; color: var(--dim); margin-top: 3px; }
.agent-header-desc { font-size: .75rem; color: var(--dim); margin-top: 2px; }

.agent-header-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.last-analysis-info { text-align: right; }
.last-analysis-label { font-size: .65rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.last-analysis-time { font-size: .78rem; color: var(--text); font-weight: 600; margin-top: 1px; }

.btn-analyze {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-size: .82rem; font-weight: 700;
  box-shadow: 0 4px 20px rgba(79,110,247,.35);
  transition: all .2s;
}
.btn-analyze:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(79,110,247,.5); }
.btn-analyze:active { transform: translateY(0); }
.btn-analyze:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.spin { animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CHAT ── */
.chat-area {
  flex: 1; overflow-y: auto;
  padding: 24px 28px;
  display: flex; flex-direction: column; gap: 14px;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Estado vazio */
.chat-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; opacity: .4; padding: 40px;
}
.chat-empty-icon { font-size: 2.5rem; }
.chat-empty-text { font-size: .88rem; color: var(--dim); text-align: center; line-height: 1.6; }

/* Loading */
.chat-loading {
  display: flex; align-items: center; gap: 14px;
  padding: 20px; background: rgba(79,110,247,.06);
  border: 1px solid rgba(79,110,247,.12);
  border-radius: 14px;
}
.loading-dots span {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); margin: 0 2px;
  animation: dotBounce 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dotBounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

/* Mensagem do agente */
.msg {
  display: flex; gap: 12px; align-items: flex-start;
  max-width: 760px;
  animation: fadeSlideIn .3s ease forwards;
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-avatar {
  width: 34px; height: 34px; border-radius: 10px; overflow: hidden; flex-shrink: 0; margin-top: 2px;
  box-shadow: 0 0 12px var(--agent-glow, rgba(79,110,247,.3));
}
.msg-avatar svg { width: 100%; height: 100%; }

.msg-content { flex: 1; }
.msg-bubble {
  background: rgba(18,21,40,.8);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 4px 14px 14px 14px;
  padding: 13px 16px;
  font-size: .85rem; line-height: 1.65; color: var(--text);
}
.msg-bubble b { color: var(--agent-accent, #a0b4ff); }
.msg-bubble strong { color: var(--text); font-weight: 700; }
.msg-time { font-size: .67rem; color: var(--dim); margin-top: 5px; padding-left: 2px; }

/* Card de ação */
.action-card {
  background: rgba(18,21,40,.9);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 18px 20px;
  max-width: 560px;
  margin-left: 46px;
  position: relative; overflow-x: hidden;
  animation: fadeSlideIn .35s ease forwards;
  border: 1px solid var(--border);
}
.action-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--priority-color, var(--accent)), transparent);
}

.action-priority {
  display: flex; align-items: center; gap: 6px;
  font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 8px;
}
.priority-urgent   { color: var(--red); }
.priority-opportunity { color: var(--yellow); }
.priority-suggestion  { color: var(--green); }

.action-title { font-size: .92rem; font-weight: 700; margin-bottom: 5px; }
.action-desc  { font-size: .78rem; color: var(--dim); line-height: 1.5; margin-bottom: 14px; }

.action-btns { display: flex; gap: 8px; }
.btn-auth {
  padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #22d3a5, #059669);
  color: #fff; font-size: .8rem; font-weight: 700;
  box-shadow: 0 3px 12px rgba(34,211,165,.3);
  transition: all .2s;
}
.btn-auth:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(34,211,165,.45); }
.btn-skip {
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border2); cursor: pointer;
  background: transparent; color: var(--dim); font-size: .8rem;
  transition: all .2s;
}
.btn-skip:hover { border-color: var(--dim); color: var(--text); }

.action-done {
  display: flex; align-items: center; gap: 6px;
  font-size: .78rem; font-weight: 600;
  padding: 6px 0;
}
.action-done.executed { color: var(--green); }
.action-done.skipped  { color: var(--dim); }

/* Status bar */
.status-bar {
  padding: 11px 28px;
  background: rgba(13,15,30,.8);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: .73rem; color: var(--dim);
}
.status-left { display: flex; align-items: center; gap: 8px; }
.status-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.status-right { display: flex; align-items: center; gap: 14px; }
.status-pill {
  padding: 3px 10px; border-radius: 20px;
  background: rgba(79,110,247,.1); border: 1px solid rgba(79,110,247,.2);
  font-size: .68rem; font-weight: 600; color: #a0b4ff;
}

/* ── TOAST ── */
.toast-container { position: fixed; top: 70px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 18px; border-radius: 10px; font-size: .82rem; font-weight: 600;
  backdrop-filter: blur(12px); border: 1px solid;
  animation: toastIn .3s ease; max-width: 320px;
}
.toast.ok  { background: rgba(34,211,165,.15); border-color: rgba(34,211,165,.3); color: var(--green); }
.toast.err { background: rgba(247,89,89,.15);  border-color: rgba(247,89,89,.3);  color: var(--red); }
@keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

/* ── SCROLLBAR GLOBAL ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── MODAL PERÍODO ── */
.period-modal {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.7); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
}
.period-box {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 32px 36px; max-width: 460px; width: 92%;
  box-shadow: 0 32px 80px rgba(0,0,0,.6);
  animation: fadeSlideIn .25s ease;
}
.period-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
.period-sub   { font-size: .78rem; color: var(--dim); margin-bottom: 22px; }
.period-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.period-opt {
  padding: 12px 8px; border-radius: 10px; border: 1px solid var(--border2);
  background: var(--surface3); color: var(--text); font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: all .18s; text-align: center;
}
.period-opt:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,110,247,.08); }
.period-opt.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.period-divider { font-size: .72rem; color: var(--muted); text-align: center; margin-bottom: 12px; }
.period-custom-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.period-custom-row input[type=date] {
  flex: 1; min-width: 130px; background: var(--surface3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: .8rem; outline: none;
}
.period-custom-row input[type=date]:focus { border-color: var(--accent); }
.period-footer { display: flex; gap: 10px; }
.period-btn-go {
  flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-size: .88rem; font-weight: 700; transition: opacity .2s;
}
.period-btn-go:hover { opacity: .88; }
.period-btn-cancel {
  padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border2);
  background: transparent; color: var(--dim); font-size: .82rem; cursor: pointer; transition: all .2s;
}
.period-btn-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── ACTION EXTRAS ── */
.action-copy-preview {
  background: var(--surface3); border-radius: 8px; padding: 10px 12px;
  margin: 8px 0; font-size: .76rem; line-height: 1.7;
  max-height: 320px; overflow-y: auto;
}
.action-copy-preview::-webkit-scrollbar { width: 3px; }
.action-copy-preview::-webkit-scrollbar-track { background: transparent; }
.action-copy-preview::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.action-copy-preview b { color: var(--dim); font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; }
.action-copy-preview .preview-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.action-copy-preview .preview-row:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.btn-create { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: .78rem; font-weight: 700; background: linear-gradient(135deg,var(--green),#16a37a); color: #fff; transition: opacity .2s; }
.btn-create:hover { opacity: .85; }
.btn-create:disabled { opacity: .4; cursor: not-allowed; }
.btn-download { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(79,110,247,.4); background: rgba(79,110,247,.1); color: var(--accent); font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .2s; }
.btn-download:hover { background: rgba(79,110,247,.2); }
.create-result { margin-top: 8px; padding: 9px 12px; border-radius: 8px; font-size: .76rem; font-weight: 600; }
.create-result.ok { background: rgba(34,211,165,.1); border: 1px solid rgba(34,211,165,.3); color: var(--green); }
.create-result.err { background: rgba(247,89,89,.1); border: 1px solid rgba(247,89,89,.3); color: var(--red); }
</style>
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL PERÍODO -->
<div class="period-modal" id="periodModal" style="display:none">
  <div class="period-box">
    <div class="period-title">📅 Período de análise</div>
    <div class="period-sub">Selecione o intervalo que o agente vai analisar</div>
    <div class="period-grid">
      <button class="period-opt" onclick="selectPeriod('today')">Hoje</button>
      <button class="period-opt selected" onclick="selectPeriod('last_7d')">Últimos 7 dias</button>
      <button class="period-opt" onclick="selectPeriod('last_14d')">Últimos 14 dias</button>
      <button class="period-opt" onclick="selectPeriod('last_30d')">Últimos 30 dias</button>
      <button class="period-opt" onclick="selectPeriod('last_90d')">Últimos 90 dias</button>
      <button class="period-opt" onclick="selectPeriod('this_month')">Este mês</button>
    </div>
    <div class="period-divider">— ou período personalizado —</div>
    <div class="period-custom-row">
      <input type="date" id="pSince" placeholder="De"/>
      <span style="color:var(--muted)">→</span>
      <input type="date" id="pUntil" placeholder="Até"/>
    </div>
    <div class="period-footer">
      <button class="period-btn-go" id="periodBtnGo" onclick="confirmPeriod()">🔍 Analisar</button>
      <button class="period-btn-cancel" onclick="document.getElementById('periodModal').style.display='none'">Cancelar</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">📡</div>
    <div>
      <h1>Meta Ads — Essence Atrativos</h1>
      <span>Painel de Controle</span>
    </div>
  </div>
  <nav class="nav">
    <a href="/meta-dashboard.html" class="nav-btn">📊 Dashboard</a>
    <a href="/agentes.html"        class="nav-btn active">🤖 Time de Agentes</a>
    <a href="/vendas.html"         class="nav-btn">🛒 Vendas</a>
  </nav>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Time de IA</div>
      <div class="sidebar-subtitle">6 Agentes Ativos</div>
    </div>

    <div class="agents-list" id="agentsList"></div>

    <div class="sidebar-footer">
      <div class="next-analysis">
        <span class="next-dot"></span>
        <span id="nextAnalysis">Próxima análise: 08:00</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="agent-header" id="agentHeader"></div>
    <div class="chat-area"   id="chatArea"></div>
    <div class="status-bar"  id="statusBar"></div>
  </main>

</div>

<script>
/* ═══════════════════════════════════════════════════
   DADOS DOS AGENTES
═══════════════════════════════════════════════════ */
const AGENTS = [
  {
    id: 'trace',
    name: 'Trace',
    role: 'Analista de Tráfego Pago',
    desc: 'Especialista em performance · Transforma dados em decisões claras',
    mode: 'auto',

  renderSidebar();
  await loadStatus();
  selectAgent(AGENTS[0]);
}

/* ═══════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════ */
function renderSidebar() {
  const list = document.getElementById('agentsList');
  list.innerHTML = AGENTS.map(ag => `
    <div class="agent-item" id="item-${ag.id}" onclick="selectAgent(AGENTS.find(a=>a.id==='${ag.id}'))">
      <div class="agent-avatar">${ag.svg}</div>
      <div class="agent-meta">
        <div class="agent-meta-name">${ag.name}</div>
        <div class="agent-meta-role">${ag.role}</div>
        <div class="agent-meta-status" id="status-${ag.id}">
          <span class="status-dot idle"></span>
          <span class="status-text idle">Carregando…</span>
        </div>
      </div>
      <div class="badge" id="badge-${ag.id}" style="display:none"></div>
    </div>
  `).join('');
}

function updateSidebarStatus(id, status, text, pending) {
  const st = document.getElementById(`status-${id}`);
  if (st) st.innerHTML = `<span class="status-dot ${status}"></span><span class="status-text ${status}">${text}</span>`;
  const badge = document.getElementById(`badge-${id}`);
  if (badge) { badge.textContent = pending; badge.style.display = pending > 0 ? '' : 'none'; }
}

/* ═══════════════════════════════════════════════════
   SELECT AGENT
═══════════════════════════════════════════════════ */
function selectAgent(ag) {
  activeAgent = ag;
  document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`item-${ag.id}`);
  if (item) item.classList.add('active');
  renderHeader(ag);
  renderChat(ag);
  renderStatusBar();
}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
function renderHeader(ag) {
  const data = agentsData[ag.id] || {};
  const lastTime = data.generated_at
    ? new Date(data.generated_at).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    : ag.mode === 'auto' ? 'Nunca analisado' : 'Sob demanda';

  document.getElementById('agentHeader').style.cssText =
    `--agent-color1:${ag.color1};--agent-glow:${ag.glow};--agent-accent:${ag.accent}`;
  document.getElementById('agentHeader').innerHTML = `
    <div class="agent-header-avatar">${ag.svg}</div>
    <div class="agent-header-info">
      <div class="agent-header-name">${ag.name}</div>
      <div class="agent-header-role">${ag.role}</div>
      <div class="agent-header-desc">${ag.desc}</div>
    </div>
    <div class="agent-header-right">
      <div class="last-analysis-info">
        <div class="last-analysis-label">Última análise</div>
        <div class="last-analysis-time">${lastTime}</div>
      </div>
      <button class="btn-analyze" id="btnAnalyze" onclick="analyze()">
        <span id="analyzeIcon">🔄</span> Analisar agora
      </button>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   CHAT
═══════════════════════════════════════════════════ */
function renderChat(ag) {
  const area = document.getElementById('chatArea');
  const data = agentsData[ag.id];

  area.style.cssText = `--agent-glow:${ag.glow};--agent-accent:${ag.accent}`;

  if (!data || !data.messages || data.messages.length === 0) {
    area.innerHTML = renderEmpty(ag);
    return;
  }

  if (data.status === 'working') {
    area.innerHTML = renderLoading(ag);
    return;
  }

  area.innerHTML = data.messages.map((msg, i) => renderMessage(msg, i, ag)).join('');
  area.scrollTop = area.scrollHeight;
}

function renderEmpty(ag) {
  const isAuto = ag.mode === 'auto';
  return `
    <div class="chat-empty">
      <div class="chat-empty-icon">${isAuto ? '🌅' : '✏️'}</div>
      <div class="chat-empty-text">
        ${isAuto
          ? `${ag.name} analisa suas campanhas automaticamente às 08:00.<br>Clique em <b>Analisar agora</b> para iniciar agora mesmo.`
          : `${ag.name} trabalha sob demanda.<br>Clique em <b>Analisar agora</b> para ativar.`}
      </div>
    </div>`;
}

function renderLoading(ag) {
  return `
    <div class="chat-loading">
      <div class="agent-avatar" style="width:36px;height:36px;flex-shrink:0">${ag.svg}</div>
      <div>
        <div style="font-size:.82rem;font-weight:600;margin-bottom:6px">${ag.name} está analisando suas campanhas…</div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
}

function renderMessage(msg, idx, ag) {
  if (msg.type === 'text') {
    return `
      <div class="msg">
        <div class="msg-avatar">${ag.svg}</div>
        <div class="msg-content">
          <div class="msg-bubble">${msg.text}</div>
          ${idx === 0 ? `<div class="msg-time">${agentsData[ag.id]?.generated_at
            ? new Date(agentsData[ag.id].generated_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + ' — análise automática'
            : ''}</div>` : ''}
        </div>
      </div>`;
  }

  if (msg.type === 'action') {
    const priMap = { urgent:'urgent', opportunity:'opportunity', suggestion:'suggestion' };
    const priLabel = { urgent:'🔴 Urgente', opportunity:'🟡 Oportunidade', suggestion:'🟢 Sugestão' };
    const pri = priMap[msg.priority] || 'suggestion';
    const colorMap = { urgent:'var(--red)', opportunity:'var(--yellow)', suggestion:'var(--green)' };

    if (msg.status === 'executed') return `
      <div class="action-card" style="--priority-color:${colorMap[pri]}">
        <div class="action-done executed">✅ Executado — ${msg.title}</div>
      </div>`;
    if (msg.status === 'skipped') return `
      <div class="action-card" style="--priority-color:${colorMap[pri]}">
        <div class="action-done skipped">⊘ Ignorado — ${msg.title}</div>
      </div>`;

    // Criar campanha (Ada)
    if (msg.action_type === 'create_campaign') {
      const p = msg.action_payload || {};
      // fallbacks para variações de nomes de campo que a IA pode usar
      const camName   = p.campaign_name || p.nome || p.name || '';
      const headline  = p.copy_headline || p.headline || p.titulo || p.head || '';
      const body      = p.copy_body || p.body || p.texto || p.copy_text || p.copy || '';
      const budget    = p.daily_budget_brl ?? p.budget_brl ?? p.budget ?? p.daily_budget ?? '';
      const objetivo  = p.objective || p.objetivo || '';
      const cta       = p.cta_type || p.cta || '';
      const objPT     = { OUTCOME_LEADS:'Geração de Leads', OUTCOME_SALES:'Vendas', OUTCOME_TRAFFIC:'Tráfego', OUTCOME_AWARENESS:'Reconhecimento', OUTCOME_ENGAGEMENT:'Engajamento' };
      const ctaPT     = { SEND_MESSAGE:'Enviar Mensagem (WhatsApp)', LEARN_MORE:'Saiba Mais', SHOP_NOW:'Comprar Agora', SIGN_UP:'Cadastrar', CONTACT_US:'Fale Conosco' };

      return `
        <div class="action-card" style="--priority-color:${colorMap[pri]}">
          <div class="action-priority priority-${pri}">${priLabel[msg.priority] || '🟢 Sugestão'}</div>
          <div class="action-title">${msg.title}</div>
          <div class="action-desc">${msg.description}</div>
          <div class="action-copy-preview">
            ${camName   ? `<div class="preview-row"><b>Nome da Campanha</b><br>${camName}</div>` : ''}
            ${headline  ? `<div class="preview-row"><b>Headline</b><br>${headline}</div>` : ''}
            ${body      ? `<div class="preview-row"><b>Texto do Anúncio</b><br>${body.replace(/\n/g,'<br>')}</div>` : ''}
            ${budget    ? `<div class="preview-row"><b>Orçamento Diário</b><br>R$ ${budget}/dia</div>` : ''}
            ${objetivo  ? `<div class="preview-row"><b>Objetivo</b><br>${objPT[objetivo] || objetivo}</div>` : ''}
            ${cta       ? `<div class="preview-row"><b>Botão CTA</b><br>${ctaPT[cta] || cta}</div>` : ''}
          </div>
          <div class="action-btns" id="create-btns-${idx}">
            <button class="btn-create" onclick="createCampaign('${ag.id}', ${idx})">🚀 Criar no Gerenciador</button>
            <button class="btn-skip" onclick="skipAction('${ag.id}', ${idx})">✗ Ignorar</button>
          </div>
          <div id="create-result-${idx}"></div>
        </div>`;
    }

    // Download de relatório (Rex)
    if (msg.action_type === 'download_report') {
      return `
        <div class="action-card" style="--priority-color:${colorMap[pri]}">
          <div class="action-priority priority-${pri}">${priLabel[msg.priority] || '🟢 Sugestão'}</div>
          <div class="action-title">${msg.title}</div>
          <div class="action-desc">${msg.description}</div>
          <div class="action-btns">
            <button class="btn-download" onclick="downloadRexReport()">📥 Baixar relatório HTML</button>
          </div>
        </div>`;
    }

    return `
      <div class="action-card" style="--priority-color:${colorMap[pri]}">
        <div class="action-priority priority-${pri}">${priLabel[msg.priority] || '🟢 Sugestão'}</div>
        <div class="action-title">${msg.title}</div>
        <div class="action-desc">${msg.description}</div>
        <div class="action-btns">
          ${msg.action_type !== 'info_only'
            ? `<button class="btn-auth" onclick="authorize('${ag.id}', ${idx})">✓ Autorizar</button>`
            : ''}
          <button class="btn-skip" onclick="skipAction('${ag.id}', ${idx})">✗ Ignorar</button>
        </div>
      </div>`;
  }
  return '';
}

/* ═══════════════════════════════════════════════════
   STATUS BAR
═══════════════════════════════════════════════════ */
function renderStatusBar() {
  const total = Object.values(agentsData).reduce((acc, d) => {
    if (!d.messages) return acc;
    return acc + d.messages.filter(m => m.type === 'action' && m.status === 'pending').length;
  }, 0);

  document.getElementById('statusBar').innerHTML = `
    <div class="status-left">
      <span class="status-pulse"></span>
      Sistema operacional · Análise automática às 08:00
    </div>
    <div class="status-right">
      ${total > 0 ? `<span class="status-pill">⚡ ${total} ação${total > 1 ? 'ões' : ''} pendente${total > 1 ? 's' : ''}</span>` : ''}
      <span style="font-size:.72rem;color:var(--dim)">6 agentes online</span>
    </div>`;
}

/* ═══════════════════════════════════════════════════
   API CALLS
═══════════════════════════════════════════════════ */
async function loadStatus() {
  try {
    const r = await fetch('/api/agents/status');
    if (!r.ok) throw new Error();
    agentsData = await r.json();
    AGENTS.forEach(ag => {
      const d = agentsData[ag.id] || {};
      const pending = (d.messages || []).filter(m => m.type === 'action' && m.status === 'pending').length;
      const statusMap = { ready:'ready', working:'working', idle:'idle' };
      const textMap   = { ready:'Análise pronta', working:'Analisando…', idle:'Aguardando' };
      const s = statusMap[d.status] || 'idle';
      updateSidebarStatus(ag.id, s, textMap[s], pending);
    });
  } catch {
    AGENTS.forEach(ag => updateSidebarStatus(ag.id, 'idle', 'Aguardando', 0));
  }
}

// ── SELEÇÃO DE PERÍODO ────────────────────────────────────────────────────────
let selectedPeriod = 'last_7d';

function analyze() {
  if (isAnalyzing) return;
  // Mostrar modal de período
  document.getElementById('periodModal').style.display = 'flex';
  // Resetar datas customizadas
  document.getElementById('pSince').value = '';
  document.getElementById('pUntil').value = '';
}

function selectPeriod(p) {
  selectedPeriod = p;
  document.querySelectorAll('.period-opt').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
}

function confirmPeriod() {
  const since = document.getElementById('pSince').value;
  const until = document.getElementById('pUntil').value;
  if (since && until) {
    selectedPeriod = `${since}|${until}`;
  }
  document.getElementById('periodModal').style.display = 'none';
  runAnalysis(selectedPeriod);
}

async function runAnalysis(period) {
  if (isAnalyzing) return;
  isAnalyzing = true;

  const btn  = document.getElementById('btnAnalyze');
  const icon = document.getElementById('analyzeIcon');
  if (btn)  btn.disabled = true;
  if (icon) icon.innerHTML = '<span class="spin">⟳</span>';

  updateSidebarStatus(activeAgent.id, 'working', 'Analisando…', 0);
  const area = document.getElementById('chatArea');
  area.innerHTML = renderLoading(activeAgent);

  try {
    const storedKey     = localStorage.getItem('cfg_anthropic_key') || '';
    const storedAccId   = localStorage.getItem('cfg_acc_id') || '';
    const storedMetaTok = localStorage.getItem('cfg_meta_token') || '';
    const r = await fetch(`/api/agents/${activeAgent.id}/analyze`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(storedKey     ? { 'x-anthropic-key': storedKey     } : {}),
        ...(storedAccId   ? { 'x-acc-id':         storedAccId   } : {}),
        ...(storedMetaTok ? { 'x-meta-token':      storedMetaTok } : {}),
      },
      body: JSON.stringify({ period }),
    });
    if (!r.ok) throw new Error(await r.text());
    agentsData = await r.json();
    const d = agentsData[activeAgent.id] || {};
    const pending = (d.messages || []).filter(m => m.type === 'action' && m.status === 'pending').length;
    updateSidebarStatus(activeAgent.id, 'ready', 'Análise pronta', pending);
    renderHeader(activeAgent);
    renderChat(activeAgent);
    renderStatusBar();
    toast('Análise concluída!', true);
  } catch (e) {
    updateSidebarStatus(activeAgent.id, 'idle', 'Erro na análise', 0);
    area.innerHTML = renderEmpty(activeAgent);
    toast('Erro ao analisar: ' + (e.message || 'tente novamente'), false);
  } finally {
    isAnalyzing = false;
    const b2 = document.getElementById('btnAnalyze');
    const i2 = document.getElementById('analyzeIcon');
    if (b2) b2.disabled = false;
    if (i2) i2.textContent = '🔄';
  }
}

async function authorize(agentId, msgIdx) {
  try {
    const metaTok = localStorage.getItem('cfg_meta_token') || '';
    const accId   = localStorage.getItem('cfg_acc_id')    || '';
    const r = await fetch(`/api/agents/${agentId}/action`, { method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        ...(metaTok ? { 'x-meta-token': metaTok } : {}),
        ...(accId   ? { 'x-acc-id':     accId   } : {}),
      },
      body: JSON.stringify({ message_index: msgIdx, confirmed: true }) });
    if (!r.ok) throw new Error(await r.text());
    agentsData = await r.json();
    selectAgent(activeAgent);
    toast('Ação executada com sucesso!', true);
  } catch (e) {
    toast('Erro ao executar: ' + (e.message || 'tente novamente'), false);
  }
}

async function skipAction(agentId, msgIdx) {
  try {
    const r = await fetch(`/api/agents/${agentId}/action`, { method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message_index: msgIdx, confirmed: false }) });
    if (!r.ok) throw new Error();
    agentsData = await r.json();
    selectAgent(activeAgent);
  } catch { toast('Erro ao ignorar ação', false); }
}

/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
function toast(msg, ok) {
  const t = document.createElement('div');
  t.className = `toast ${ok ? 'ok' : 'err'}`;
  t.textContent = (ok ? '✓ ' : '✗ ') + msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ═══════════════════════════════════════════════════
   ADA — CRIAR CAMPANHA
═══════════════════════════════════════════════════ */
async function createCampaign(agentId, msgIdx) {
  const msg = agentsData[agentId]?.messages?.[msgIdx];
  if (!msg) return;
  const p = msg.action_payload || {};

  // normaliza nomes de campo antes de enviar para o servidor
  const payload = {
    campaign_name:   p.campaign_name || p.nome || p.name || 'Campanha Ada',
    objective:       p.objective || p.objetivo || 'OUTCOME_LEADS',
    daily_budget_brl: p.daily_budget_brl ?? p.budget_brl ?? p.budget ?? p.daily_budget ?? 30,
    copy_headline:   p.copy_headline || p.headline || p.titulo || p.head || '',
    copy_body:       p.copy_body || p.body || p.texto || p.copy_text || p.copy || '',
    cta_type:        p.cta_type || p.cta || 'SEND_MESSAGE',
    base_campaign_id: p.base_campaign_id || p.campaign_id || null,
  };

  const btns = document.getElementById(`create-btns-${msgIdx}`);
  const res  = document.getElementById(`create-result-${msgIdx}`);
  if (btns) btns.querySelector('.btn-create').disabled = true;

  res.innerHTML = '<div style="font-size:.76rem;color:var(--dim);padding:6px 0">⏳ Criando campanha no Gerenciador de Anúncios…</div>';

  try {
    const r = await fetch('/api/agents/ada/create-campaign', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-meta-token': localStorage.getItem('cfg_meta_token') || '',
        'x-acc-id':     localStorage.getItem('cfg_acc_id') || '',
      },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Erro desconhecido');

    res.innerHTML = `
      <div class="create-result ok">
        ✅ Campanha criada com sucesso (pausada)!<br>
        <a href="${data.ads_manager_url}" target="_blank" style="color:var(--accent);text-decoration:underline;font-size:.74rem">
          → Abrir no Gerenciador de Anúncios para adicionar criativo e publicar
        </a>
      </div>`;
    toast('Campanha criada! Adicione o criativo no Gerenciador.', true);
  } catch (e) {
    res.innerHTML = `<div class="create-result err">❌ Erro: ${e.message}</div>`;
    if (btns) btns.querySelector('.btn-create').disabled = false;
    toast('Erro ao criar campanha: ' + e.message, false);
  }
}

/* ═══════════════════════════════════════════════════
   REX — DOWNLOAD RELATÓRIO
═══════════════════════════════════════════════════ */
function downloadRexReport() {
  const data = agentsData['rex'];
  if (!data || !data.messages) return;

  const period = data.period || 'Período não informado';
  const date   = data.generated_at ? new Date(data.generated_at).toLocaleString('pt-BR') : '';
  const msgs   = data.messages.filter(m => m.type === 'text').map(m => m.text).join('\n\n');

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Relatório Meta Ads — Essence Atrativos</title>
<style>
  body{font-family:'Segoe UI',sans-serif;max-width:800px;margin:40px auto;padding:0 24px;color:#1a1a2e;line-height:1.7}
  h1{font-size:1.6rem;font-weight:800;color:#1a1a2e;margin-bottom:4px}
  .meta{font-size:.85rem;color:#666;margin-bottom:32px;padding-bottom:16px;border-bottom:2px solid #eee}
  .section{background:#f8f9ff;border-left:4px solid #4f6ef7;border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:20px;white-space:pre-wrap;font-size:.9rem}
  .footer{margin-top:40px;font-size:.75rem;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:16px}
</style>
</head>
<body>
<h1>📊 Relatório Meta Ads — Essence Atrativos</h1>
<div class="meta">Período: <strong>${period}</strong> &nbsp;|&nbsp; Gerado em: ${date} &nbsp;|&nbsp; Agente: Rex</div>
${data.messages.filter(m=>m.type==='text').map(m=>`<div class="section">${m.text}</div>`).join('')}
<div class="footer">Gerado automaticamente pelo Time de Agentes IA · Meta Ads Dashboard · Essence Atrativos</div>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `relatorio-meta-${period}-${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Relatório baixado!', true);
}

/* ═══════════════════════════════════════════════════
   BOOT

init();
setInterval(loadStatus, 30000);
</script>
